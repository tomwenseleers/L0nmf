url: https://tomwenseleers.github.io/L0nmf/
title: L0nmf
repo:
  url:
    home: https://github.com/tomwenseleers/L0nmf/
    source: https://github.com/tomwenseleers/L0nmf/blob/master/L0nmf/
    issue: https://github.com/tomwenseleers/L0nmf/issues
    user: https://github.com/
destination: ../docs
template:
  bootstrap: 5
  theme: github-dark
  math-rendering: katex
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "L0nmf hex logo showing a sparse matrix factorized into profiles and spectral loadings"
  bslib:
    bg: "#fcfdfd"
    fg: "#203047"
    primary: "#087e83"
    base_font: "system-ui"
    heading_font: "system-ui"
    code_font: "system-ui"
    border-radius: 0.6rem
    navbar-bg: "#081629"
navbar:
  bg: dark
  type: dark
  structure:
    left: [intro, tutorials, algorithm, reference, news]
    right: [search, github]
  components:
    tutorials:
      text: Tutorials
      menu:
        - text: Sparse log-concave factorization
          href: articles/log-concave-nmf.html
        - text: GC/MS workflow in GCMSprime
          href: https://tomwenseleers.github.io/GCMSprime/articles/gcms-deconvolution.html
    intro:
      text: Get started
      href: articles/log-concave-nmf.html
    algorithm:
      text: Algorithm & theory
      href: articles/log-concave-nmf.html
    github:
      icon: fab fa-github
      href: https://github.com/tomwenseleers/L0nmf
home:
  strip_header: false
  title: "Sparse nonnegative matrix factorization, log-concave profiles and flexible noise models."
  sidebar:
    structure: [links, citation, authors, license]
authors:
  sidebar:
    roles: [aut, cre, ctb]
