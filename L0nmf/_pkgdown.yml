url: https://tomwenseleers.github.io/L0nmf/
title: L0nmf
repo:
  url:
    home: https://github.com/tomwenseleers/L0nmf/
    source: https://github.com/tomwenseleers/L0nmf/blob/master/L0nmf/
    issue: https://github.com/tomwenseleers/L0nmf/issues
    user: https://github.com/
destination: ../docs
template:
  bootstrap: 5
  theme: github-dark
  math-rendering: katex
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "L0nmf hex logo showing a sparse matrix factorized into profiles and spectral loadings"
  bslib:
    bg: "#fcfdfd"
    fg: "#203047"
    primary: "#087e83"
    base_font: "system-ui"
    heading_font: "system-ui"
    code_font: "system-ui"
    border-radius: 0.6rem
    navbar-bg: "#081629"
navbar:
  bg: dark
  type: dark
  structure:
    left: [intro, tutorials, algorithm, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/estimate-psf.html
    tutorials:
      text: Tutorials
      menu:
        - text: Estimate PSFs
          href: articles/estimate-psf.html
        - text: Sparse log-concave NMF with automatic best rank tuning
          href: articles/log-concave-nmf.html
        - text: Coupled multisample log-concave NMF with automatic best rank tuning
          href: articles/coupled-nmf.html
    algorithm:
      text: Algorithm & theory
      href: articles/algorithm.html
    github:
      icon: fab fa-github
      href: https://github.com/tomwenseleers/L0nmf
home:
  strip_header: false
  title: "L0nmf: Scalable Sparse Nonnegative Matrix Factorization with Automatic Rank Selection and Flexible Noise Models"
  sidebar:
    structure: [links, citation, authors, license]
authors:
  sidebar:
    roles: [aut, cre, ctb]

articles:
  - title: Tutorials
    contents: [articles/estimate-psf, articles/log-concave-nmf, articles/coupled-nmf]
  - title: Algorithm and theory
    contents: [articles/algorithm]
reference:
  - title: Estimate point spread functions and deconvolve signals
    contents: [estimate_psf, estimate_psf_from_std, L0glm_blind_deco, L0glm_sparse_deco, L0glm_deco_estkernel]
  - title: Sparse and coupled factorization
    contents: [splogconNMF, coupledNMF, sampleNMF]
  - title: Noise calibration and profile constraints
    contents: [estimate_signal_noise, log_conc_smooth]
  - title: Simulations and experimental data
    contents: [simulate_GCMS, simulate_GCMS_samples, GCMS_data1, GCMS_data2]
  - title: Shared tools and package overview
    contents: [reexports, L0nmf-package]
